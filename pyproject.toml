[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeflow"
version = "0.1.0"
description = "Queue-driven ingestion pipeline: CSV/Excel/XML -> Parquet data lake on Azure, with profiling and validation."
requires-python = ">=3.11"
dependencies = [
    "polars>=1.30",
    "duckdb>=1.1",
    "pyarrow>=16",
    "fastexcel>=0.12",          # Excel reader used by polars (calamine engine)
    "lxml>=5",
    "charset-normalizer>=3.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "azure-storage-blob>=12.20",
    "azure-servicebus>=7.12",
    "azure-identity>=1.17",     # managed identity / Entra ID auth in Azure
    "pymssql>=2.3",             # SQL Server / Azure SQL driver (no ODBC install needed)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "xlsxwriter>=3.2"]  # xlsxwriter: tests write Excel files

[project.scripts]
lakeflow = "lakeflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: performance tests on 1M rows (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI declares dependencies in argument defaults by design

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # generated column lists read better unwrapped

[tool.mypy]
python_version = "3.11"
strict_optional = true
ignore_missing_imports = true
